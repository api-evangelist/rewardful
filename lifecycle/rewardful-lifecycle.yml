name: Rewardful API Lifecycle
description: >-
  Versioning, deprecation and operational-transparency posture for the Rewardful REST API.
  Versioning is a bare /v1 URI prefix; there is NO published deprecation policy, no Sunset
  header support and no SLA document. A real, public status page is operated.
versioning:
  scheme: uri-path
  current: v1
  since: null
  docs: https://developers.rewardful.com/rest-api/overview
  note: >-
    Every documented endpoint sits under https://api.getrewardful.com/v1. Webhook payloads
    stamp `event.api_version: "v1"`. No version header, no date-pinned version train, and
    no announced v2.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notice_period: null
  note: >-
    No deprecation policy, notice period, or RFC 8594 Sunset/Deprecation header support is
    documented anywhere in the developer center. The only forward-looking caveat published
    is on rate limits: "We may reduce limits at any time to prevent abuse." No Deprecation
    pointer is emitted in apis.yml, because there is no policy to point at.
sla:
  url: null
  uptime_target: null
  note: No SLA or uptime commitment is published; the status page reports observed uptime only.
