method: searched
source: https://developers.rewardful.com/webhooks/event-types
name: Rewardful Webhook Event Catalog
description: >-
  Rewardful publishes NO AsyncAPI document, but it does document a complete outbound webhook
  surface — 33 event types across seven object families, an HMAC-SHA256 signature, and a
  three-day exponential-backoff retry contract. Captured here as a webhook catalog; nothing
  is fabricated into an event spec the provider does not publish.
spec_type: none
asyncapi_published: false
asyncapi_probe:
  - {url: 'https://developers.rewardful.com/asyncapi.yaml', status: 404}
  - {url: 'https://api.getrewardful.com/asyncapi.json', status: 404}
transport:
  protocol: https
  method: POST
  direction: outbound
  content_type: application/json
  endpoint_management: https://app.getrewardful.com/webhooks
  requirements:
    - Endpoints must be served over HTTP/SSL.
    - Endpoint must return 200; any other status is treated as a failure.
  docs: https://developers.rewardful.com/webhooks/endpoints
payload:
  root_keys:
    - {name: object, description: 'JSON representation of the record that triggered the event; identical in structure to the REST API representation of that object type.'}
    - {name: event, description: 'Event metadata: id (UUID), type, created_at (ISO 8601), api_version.'}
    - {name: request, description: 'Request metadata: id (UUID) for this specific delivery.'}
  docs: https://developers.rewardful.com/webhooks/requests
security:
  signature_header: X-Rewardful-Signature
  algorithm: HMAC-SHA256
  signed_content: raw request body
  key: per-endpoint Signing Secret from the Webhooks page in the dashboard
  verification: optional but strongly recommended
  timestamp_in_signature: false
  replay_protection: >-
    None documented. The signature covers the body only — there is no timestamp or nonce in
    the signature scheme, so a captured delivery can be replayed against the receiver.
  docs: https://developers.rewardful.com/webhooks/signed-webhooks
delivery:
  retry_policy: exponential backoff for up to 3 days, then delivery is abandoned
  success_status: 200
  ordering_guarantee: none documented
  docs: https://developers.rewardful.com/webhooks/requests
