aid: rewardful
name: Rewardful
description: >-
  Rewardful is affiliate and referral management software for SaaS, connecting to Stripe or
  Paddle to track referrals and commissions automatically — adjusting for upgrades,
  downgrades, cancellations and refunds — and paying affiliates in bulk through PayPal or
  Wise. Its v1 REST API exposes campaigns, affiliates, affiliate links, affiliate coupons,
  referrals, commissions and payouts over HTTP Basic auth, alongside 33 signed webhook event
  types and a browser tracking script with a client-side JavaScript conversion API. A Stripe
  Premier Partner used by 3,000+ SaaS, tech and AI teams.
