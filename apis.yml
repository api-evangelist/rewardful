x-contract-discovery:
  date: '2026-08-14'
  openapi: false
  graphql: false
  asyncapi: false
  agent_card: false
  mcp: true
  note: >-
    Rewardful publishes NO machine-readable API contract. /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc were probed on
    api.getrewardful.com and developers.rewardful.com and all returned 404; there is no
    GraphQL surface and no AsyncAPI document. A stale `type: OpenAPI` pointer at
    https://developers.rewardful.com/ was REMOVED from the REST API entry in this pass —
    that URL is the GitBook docs home, not a spec, and the pointer was crediting a contract
    that does not exist. What IS live and machine-readable: a documentation MCP server at
    https://developers.rewardful.com/~gitbook/mcp (anonymous, 4 tools, tools/list 200) and
    two llms.txt files. The REST reference itself is prose-only, so every derived artifact
    in this repo is grounded in documented HTTP method + path, never in an invented
    operationId.
