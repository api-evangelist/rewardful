name: Rewardful Packages and Client Libraries
description: >-
  First-party distribution surface for Rewardful. Rewardful publishes NO official
  REST API client library in any language — the developer docs state the integration
  path is plain HTTP against https://api.getrewardful.com/v1 with HTTP Basic Auth.
  What the company does distribute is a browser tracking script served from a CDN and
  two archived platform integration plugins. Every package found here is either
  archived, abandoned on its registry, or unpinned.
